<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>成员资料管理 | Omega KRR Group</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f4f7fb; color: #172033; }
      .notice { max-width: 720px; margin: 12vh auto; padding: 2rem; background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(23,32,51,.12); }
      .notice h1 { margin-top: 0; }
      .notice code { background: #eef2f7; padding: .15rem .35rem; border-radius: 4px; }
      .notice a { color: #155eef; }
    </style>
  </head>
  <body>
    <noscript><div class="notice"><h1>需要启用 JavaScript</h1><p>成员资料管理后台需要 JavaScript 才能运行。</p></div></noscript>
    <div id="security-notice" class="notice" hidden>
      <h1>管理后台尚未启用</h1>
      <p>GitHub 登录只允许在 HTTPS 下使用。请先为网站配置域名和 HTTPS，再按照仓库中的 <code>CMS_SETUP.md</code> 完成 OAuth 配置。</p>
      <p><a href="/zh/">返回网站</a></p>
    </div>
    <script>
      if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        document.getElementById("security-notice").hidden = false;
      } else {
        window.CMS_MANUAL_INIT = true;
        const cms = document.createElement("script");
        cms.src = "/admin/decap-cms.js";
        cms.onload = () => {
          const config = document.createElement("script");
          config.src = "/admin/config.js";
          document.body.appendChild(config);
        };
        document.body.appendChild(cms);
      }
    </script>
  </body>
</html>
